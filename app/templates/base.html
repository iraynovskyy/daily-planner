<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Daily Planner{% endblock %}</title>
  <script>
    // Apply the saved theme before first paint (no flash); default follows the OS.
    try {
      const t = localStorage.getItem("theme");
      document.documentElement.dataset.theme =
        t || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    } catch { document.documentElement.dataset.theme = "dark"; }
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
</head>
<body>
  <header class="container">
    <nav>
      <ul><li><strong>📅 Daily Planner</strong></li></ul>
      <ul>
        <li>
          <button type="button" class="theme-toggle" aria-label="Switch light / dark theme" title="Light / dark">
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
          </button>
        </li>
        {% if request.session.get("user_id") %}
        <li><a href="/">Month</a></li>
        <li><a href="/day/{{ today_iso() }}">Today</a></li>
        <li><a href="/habits">Habits</a></li>
        <li><a href="/account">Account</a></li>
        <li>
          <form method="post" action="/logout" class="logout-form">
            <button type="submit" class="logout" title="Log out">Log out</button>
          </form>
        </li>
        {% endif %}
      </ul>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15/Sortable.min.js"></script>
  <script src="/static/reorder.js"></script>
  <script src="/static/highlight.js"></script>
  <script src="/static/notes.js"></script>
  <script src="/static/theme.js"></script>
</body>
</html>
