{% extends "base.html" %}
{% block title %}Log in · Daily Planner{% endblock %}
{% block content %}
<article class="login-card">
  <h2>Log in</h2>
  {% if no_users %}
    <p class="login-hint">No user yet. Create one in a terminal:<br>
      <code>uv run python -m app.create_user &lt;username&gt;</code></p>
  {% endif %}
  {% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Username
      <input name="username" value="{{ username }}" autocomplete="username" required maxlength="50" autofocus>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required maxlength="200">
    </label>
    <button type="submit">Log in</button>
  </form>
</article>
{% endblock %}
