name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check migrations match the models
        run: uv run alembic upgrade head && uv run alembic check
        env:
          DATABASE_URL: sqlite:////tmp/ci.db

      - name: Tests
        run: uv run pytest

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: planner_test
          POSTGRES_USER: planner
          POSTGRES_PASSWORD: planner
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U planner -d planner_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://planner:planner@localhost:5432/planner_test
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Migrations apply cleanly on Postgres and match the models
        run: uv run alembic upgrade head && uv run alembic check && uv run alembic downgrade base
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Tests (Postgres)
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t daily-planner:ci .
