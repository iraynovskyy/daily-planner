name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main are not, so a deploy is never cut off halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint shell scripts
        run: shellcheck deploy/*.sh deploy/*/*.sh

      - name: Check migrations match the models
        run: uv run alembic upgrade head && uv run alembic check
        env:
          DATABASE_URL: sqlite:////tmp/ci.db

      - name: Tests
        run: uv run pytest

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: planner_test
          POSTGRES_USER: planner
          POSTGRES_PASSWORD: planner
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U planner -d planner_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://planner:planner@localhost:5432/planner_test
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Migrations apply cleanly on Postgres and match the models
        run: uv run alembic upgrade head && uv run alembic check && uv run alembic downgrade base
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Tests (Postgres)
        run: uv run pytest

  image:
    # Builds the image once; on main it is pushed to GHCR and becomes what the server runs.
    needs: [test-sqlite, test-postgres]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Image name (GHCR needs it lower-case)
        id: ref
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "image=$name:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.ref.outputs.image }}
            ${{ steps.ref.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Rolls the tested image out to the server; deploy.sh does the backup, health check and rollback.
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://planner.ihor-dev.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          IMAGE: ${{ needs.image.outputs.ref }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts   # pinned host key: no blind trust
          # The key is locked to deploy.sh on the server; the image reference is its only input.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "ops@$HOST" "$IMAGE"

      - name: Check the live site
        run: |
          for _ in $(seq 10); do
            curl -fsS https://planner.ihor-dev.com/health && exit 0
            sleep 3
          done
          exit 1
