# Local stack that mirrors production: the app + PostgreSQL.
#   docker compose up -d --build     → http://localhost:8000
# Needs POSTGRES_PASSWORD in .env (see .env.example).

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: planner
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql   # Postgres 18+ keeps its data under this path
    ports:
      - "127.0.0.1:5433:5432"        # host access for migrations / psql; localhost only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d planner"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://planner:${POSTGRES_PASSWORD}@db:5432/planner
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      SESSION_HTTPS_ONLY: ${SESSION_HTTPS_ONLY:-false}
      TZ: ${TZ:-UTC}                 # decides when "today" starts
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
