# Default habits and notes for a fresh database (the app seeds them once, when it has no habits).
# Copy this file to seed.local.toml (git-ignored) to use your own set; that file wins if present.

[[category]]
name = "Base"
icon = "🗿"
habits = [
  { name = "Workout", target = 1, unit = "10 min" },
  { name = "Food", target = 3, unit = "meals" },
  { name = "Run", target = 1, unit = "5 min" },
  { name = "AM / PM routine", target = 2 },
  { name = "Bed by 11pm", target = 1 },
]

[[category]]
name = "Career"
icon = "🏔️"
habits = [
  { name = "Learning videos", target = 2, unit = "videos" },
  { name = "Side project", target = 1, unit = "30 min" },
  { name = "Deep work", target = 1 },
  { name = "Ship something small", target = 1 },
]

[[category]]
name = "Good habits"
icon = "🌱"
habits = [
  { name = "No sugar", target = 1, optional = true },
  { name = "Reading", target = 1, unit = "5 min" },
  { name = "Tidy up", target = 1 },
]

